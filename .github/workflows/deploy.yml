name: Deploy Wildball

on:
  push:
    branches:
      - main

concurrency:
  group: wildball-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: [self-hosted, wildball-vps]

    steps:
      - name: Deploy the application
        run: |
          set -e
          cd /var/www/wildball
          git pull --ff-only origin main
          npm ci
          npm run build
          pm2 restart wildball --update-env
          pm2 save
