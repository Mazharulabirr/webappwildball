name: Deploy Wildball

on:
  push:
    branches:
      - main

concurrency:
  group: wildball-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Configure deployment SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy the application
        run: |
          ssh -o StrictHostKeyChecking=accept-new wildball@72.62.72.92 << 'REMOTE_COMMANDS'
            set -e
            cd /var/www/wildball
            git pull --ff-only origin main
            npm ci
            npm run build
            pm2 restart wildball --update-env
            pm2 save
          REMOTE_COMMANDS
