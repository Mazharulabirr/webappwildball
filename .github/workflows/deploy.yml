name: Deploy Wildball

on:
  push:
    branches:
      - main

concurrency:
  group: wildball-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: [self-hosted, wildball-vps]
    env:
      # PM2's web process must survive the runner's orphan-process cleanup.
      RUNNER_TRACKING_ID: ""

    steps:
      - name: Deploy the application
        run: |
          set -euo pipefail
          cd /var/www/wildball
          git pull --ff-only origin main

          # Build away from the running server. Rebuilding its .next directory
          # removes chunks that the live process is still advertising to users.
          build_dir=$(mktemp -d /var/www/wildball/.deploy-build.XXXXXX)
          stopped=false
          activated=false
          cleanup() {
            if [ "$stopped" = true ] && [ "$activated" = false ]; then
              for directory in .next node_modules; do
                if [ -d "$build_dir/previous/$directory" ]; then
                  rm -rf "/var/www/wildball/$directory"
                  mv "$build_dir/previous/$directory" "/var/www/wildball/$directory"
                fi
              done
              pm2 restart wildball --update-env || true
            fi
            rm -rf "$build_dir"
          }
          trap cleanup EXIT
          git archive HEAD | tar -x -C "$build_dir"
          for env_file in .env .env.local .env.production .env.production.local; do
            if [ -f "$env_file" ]; then cp "$env_file" "$build_dir/$env_file"; fi
          done
          (cd "$build_dir" && npm ci && npm run build)

          # Keep old hashed assets available for tabs opened before the deploy.
          if [ -d .next/static ]; then
            cp -an .next/static/. "$build_dir/.next/static/"
          fi
          mkdir "$build_dir/previous"
          pm2 stop wildball
          stopped=true
          # Older npm-managed restarts can leave a Next.js child holding 3000.
          # Only terminate listeners owned by this application's directory.
          for server_pid in $(ss -ltnp 'sport = :3000' | sed -n 's/.*pid=\([0-9]*\).*/\1/p'); do
            if [ "$(readlink "/proc/$server_pid/cwd")" != /var/www/wildball ]; then
              echo "Port 3000 belongs to another application; refusing to stop it."
              exit 1
            fi
            if ! tr '\0' ' ' < "/proc/$server_pid/cmdline" | grep -q next-server; then
              echo "Port 3000 listener is not the expected Next.js server."
              exit 1
            fi
            kill -TERM "$server_pid"
          done
          for attempt in $(seq 1 20); do
            if ! ss -ltn 'sport = :3000' | grep -q ':3000'; then break; fi
            sleep 0.5
          done
          for directory in .next node_modules; do
            if [ -d "$directory" ]; then mv "$directory" "$build_dir/previous/$directory"; fi
            mv "$build_dir/$directory" "$directory"
          done
          pm2 restart wildball --update-env
          node scripts/check-deployment.mjs http://localhost:3000
          activated=true
          pm2 save
